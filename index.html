<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToDoリスト</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>ToDoリスト</h1>

    <div class="input-area">
      <div class="input-row">
        <input type="text" id="todo-input" placeholder="タスクを入力してください">
        <button id="add-btn">追加</button>
      </div>
      <div class="date-row">
        <label for="deadline-input">締切日：</label>
        <input type="date" id="deadline-input">
      </div>
    </div>

    <ul id="todo-list"></ul>

    <p id="empty-message">タスクはありません</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
